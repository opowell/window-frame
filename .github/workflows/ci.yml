name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright.config.ts asks for the next Chrome rather than the bundled
      # Chromium, so that is the browser to install.
      - run: npx playwright install --with-deps chrome-beta

      - run: npm run lint

      - run: npm run typecheck

      # Ahead of the tests, because the No Build stories load dist/ over HTTP —
      # without this they would be covering the previous build.
      - run: npm run build

      # dist/ is committed, and it is what the git dependency serves. A build
      # that differs from the commit means somebody shipped stale artifacts.
      - name: dist/ is what src/ builds
        run: |
          git diff --exit-code -- dist || {
            echo "::error::dist/ differs from a fresh build. Run 'npm run build' and commit it."
            exit 1
          }

      - run: npm run test:unit

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
